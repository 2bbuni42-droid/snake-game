<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스네이크</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --board: #0e1013;
    --grid: #171a1f;
    --snake: #e53935;
    --snake-head: #ff8a80;
    --food: #ef5350;
    --accent: #ffb74d;
    --text: #e8eaed;
    --muted: #888f99;
  }
  * { box-sizing: border-box; }
  html, body {
    min-height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #wrap { width: 100%; max-width: 440px; }

  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-variant-numeric: tabular-nums;
  }
  .stat { font-size: 13px; color: var(--muted); }
  .stat b { display: block; font-size: 20px; color: var(--text); font-weight: 600; }
  #muteBtn {
    background: var(--panel);
    border: 1px solid #2c3039;
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
  }
  #muteBtn:hover { border-color: #3d424d; }

  #stage { position: relative; }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1;
    background: var(--board);
    border-radius: 10px;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(10, 12, 15, 0.82);
    border-radius: 10px;
    text-align: center;
    padding: 20px;
  }
  #overlay[hidden] { display: none !important; }
  #ovTitle { font-size: 28px; font-weight: 700; margin: 0; }
  #ovText { font-size: 14px; color: var(--muted); margin: 0; max-width: 300px; line-height: 1.5; }

  .diff { display: flex; gap: 8px; }
  .diff button, #playBtn {
    background: var(--panel);
    border: 1px solid #2c3039;
    color: var(--text);
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .diff button.on { border-color: var(--snake); color: var(--snake-head); }
  #playBtn {
    background: var(--snake);
    border-color: var(--snake);
    color: #0e1013;
    font-weight: 600;
    padding: 11px 28px;
    font-size: 15px;
  }

  #pad {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  #pad button {
    background: var(--panel);
    border: 1px solid #2c3039;
    color: var(--text);
    border-radius: 10px;
    padding: 16px 0;
    font-size: 18px;
    cursor: pointer;
  }
  #pad button:active { background: #262a33; }
  #pad .sp { visibility: hidden; }
  @media (hover: none) and (pointer: coarse) {
    #pad { display: grid; }
  }

  #hint {
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="stat">점수 <b id="score">0</b></div>
    <div class="stat">레벨 <b id="level">1</b></div>
    <div class="stat">최고 <b id="best">0</b></div>
    <button id="muteBtn" title="소리 켜기/끄기">&#128266;</button>
  </div>

  <div id="stage">
    <canvas id="game" width="480" height="480"></canvas>
    <div id="overlay">
      <h1 id="ovTitle">스네이크</h1>
      <p id="ovText">먹이를 먹고 벽과 자기 몸을 피하세요. 5점마다 속도가 빨라집니다.</p>
      <div class="diff" id="diff">
        <button data-speed="150">쉬움</button>
        <button data-speed="110" class="on">보통</button>
        <button data-speed="75">어려움</button>
      </div>
      <button id="playBtn">시작</button>
    </div>
  </div>

  <div id="pad">
    <button class="sp"></button>
    <button data-dir="up">&#9650;</button>
    <button class="sp"></button>
    <button data-dir="left">&#9664;</button>
    <button data-dir="down">&#9660;</button>
    <button data-dir="right">&#9654;</button>
  </div>

  <div id="hint">방향키 / WASD 이동 &middot; 스페이스 일시정지 &middot; Enter 다시 시작</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');
const playBtn = document.getElementById('playBtn');
const muteBtn = document.getElementById('muteBtn');

const CELLS = 24;
const GRID = canvas.width / CELLS;

const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, OVER: 3 };

let snake, food, score, level, state, baseSpeed, stepMs, lastStep, particles;
let dirQueue = [];
let direction = { x: 1, y: 0 };
let muted = false;

let best = 0;
try { best = Number(localStorage.getItem('snake_best') || 0); } catch (e) {}
try { muted = localStorage.getItem('snake_muted') === '1'; } catch (e) {}
baseSpeed = 110;

// --- audio -----------------------------------------------------------------
let audioCtx = null;
function beep(freq, dur, type, gain) {
  if (muted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const amp = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    amp.gain.setValueAtTime(gain == null ? 0.06 : gain, audioCtx.currentTime);
    amp.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(amp).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
const sfxEat = () => beep(660, 0.09);
const sfxLevel = () => { beep(784, 0.1); setTimeout(() => beep(1047, 0.12), 90); };
const sfxDie = () => { beep(220, 0.18, 'sawtooth'); setTimeout(() => beep(130, 0.3, 'sawtooth'), 140); };

function renderMute() {
  muteBtn.textContent = muted ? '\u{1F507}' : '\u{1F50A}';
}

// --- game ------------------------------------------------------------------
function reset() {
  snake = [{ x: 8, y: 12 }, { x: 7, y: 12 }, { x: 6, y: 12 }];
  direction = { x: 1, y: 0 };
  dirQueue = [];
  score = 0;
  level = 1;
  stepMs = baseSpeed;
  lastStep = 0;
  particles = [];
  food = randomFood();
  updateHud();
}

function randomFood() {
  const free = [];
  for (let y = 0; y < CELLS; y++) {
    for (let x = 0; x < CELLS; x++) {
      if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
    }
  }
  return free[Math.floor(Math.random() * free.length)];
}

function updateHud() {
  scoreEl.textContent = score;
  levelEl.textContent = level;
  bestEl.textContent = best;
}

function queueDir(d) {
  // Compare against the last queued direction so rapid inputs in one frame
  // can't chain into a 180-degree turn.
  const prev = dirQueue.length ? dirQueue[dirQueue.length - 1] : direction;
  if (d.x === -prev.x && d.y === -prev.y) return;
  if (d.x === prev.x && d.y === prev.y) return;
  if (dirQueue.length < 3) dirQueue.push(d);
}

function step() {
  if (dirQueue.length) direction = dirQueue.shift();

  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS) return die();
  // The tail cell vacates this tick, so moving into it is legal unless we grow.
  const eating = head.x === food.x && head.y === food.y;
  const body = eating ? snake : snake.slice(0, -1);
  if (body.some(s => s.x === head.x && s.y === head.y)) return die();

  snake.unshift(head);

  if (eating) {
    score++;
    if (score > best) {
      best = score;
      try { localStorage.setItem('snake_best', best); } catch (e) {}
    }
    burst(food.x, food.y);
    const newLevel = Math.floor(score / 5) + 1;
    if (newLevel > level) {
      level = newLevel;
      stepMs = Math.max(45, baseSpeed - (level - 1) * 8);
      sfxLevel();
    } else {
      sfxEat();
    }
    updateHud();
    const next = randomFood();
    if (!next) return win();
    food = next;
  } else {
    snake.pop();
  }
}

function die() {
  state = STATE.OVER;
  sfxDie();
  showOverlay('게임 오버', `점수 ${score} · 레벨 ${level}` + (score >= best && score > 0 ? ' · 신기록!' : ''), '다시 하기');
}

function win() {
  state = STATE.OVER;
  showOverlay('클리어!', '보드가 가득 찼습니다. 더 먹을 것이 없어요.', '다시 하기');
}

function showOverlay(title, text, btn) {
  ovTitle.textContent = title;
  ovText.textContent = text;
  playBtn.textContent = btn;
  overlay.hidden = false;
}

function burst(cx, cy) {
  for (let i = 0; i < 12; i++) {
    const a = (Math.PI * 2 * i) / 12 + Math.random();
    particles.push({
      x: (cx + 0.5) * GRID,
      y: (cy + 0.5) * GRID,
      vx: Math.cos(a) * (1 + Math.random() * 1.6),
      vy: Math.sin(a) * (1 + Math.random() * 1.6),
      life: 1
    });
  }
}

// --- drawing ---------------------------------------------------------------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

function draw(now) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#171a1f';
  ctx.lineWidth = 1;
  for (let i = 1; i < CELLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * GRID + 0.5, 0);
    ctx.lineTo(i * GRID + 0.5, canvas.height);
    ctx.moveTo(0, i * GRID + 0.5);
    ctx.lineTo(canvas.width, i * GRID + 0.5);
    ctx.stroke();
  }

  // food, gently pulsing
  const pulse = 1 + Math.sin(now / 180) * 0.12;
  const fs = GRID * 0.62 * pulse;
  ctx.fillStyle = '#ef5350';
  ctx.shadowColor = '#ef5350';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc((food.x + 0.5) * GRID, (food.y + 0.5) * GRID, fs / 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // particles
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.life -= 0.05;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = '#ef5350';
    ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  });
  ctx.globalAlpha = 1;

  // snake
  const pad = 1.5;
  for (let i = snake.length - 1; i >= 0; i--) {
    const s = snake[i];
    const t = i / Math.max(1, snake.length - 1);
    ctx.fillStyle = i === 0 ? '#ff8a80' : `rgb(${220 - t * 40}, ${52 + t * 6}, ${46 + t * 6})`;
    roundRect(s.x * GRID + pad, s.y * GRID + pad, GRID - pad * 2, GRID - pad * 2, i === 0 ? 6 : 4);
  }

  // eyes on the head
  const h = snake[0];
  const hx = (h.x + 0.5) * GRID, hy = (h.y + 0.5) * GRID;
  const off = GRID * 0.19;
  const px = direction.y !== 0 ? off : 0;
  const py = direction.x !== 0 ? off : 0;
  const fx = direction.x * off * 0.6, fy = direction.y * off * 0.6;
  ctx.fillStyle = '#1a0d0c';
  [[-px, -py], [px, py]].forEach(([ex, ey]) => {
    ctx.beginPath();
    ctx.arc(hx + ex + fx, hy + ey + fy, GRID * 0.09, 0, Math.PI * 2);
    ctx.fill();
  });
}

// --- loop ------------------------------------------------------------------
function frame(now) {
  if (state === STATE.PLAYING) {
    if (now - lastStep >= stepMs) {
      lastStep = now;
      step();
    }
  }
  draw(now);
  requestAnimationFrame(frame);
}

// --- input -----------------------------------------------------------------
const DIRS = {
  arrowup: { x: 0, y: -1 }, w: { x: 0, y: -1 }, up: { x: 0, y: -1 },
  arrowdown: { x: 0, y: 1 }, s: { x: 0, y: 1 }, down: { x: 0, y: 1 },
  arrowleft: { x: -1, y: 0 }, a: { x: -1, y: 0 }, left: { x: -1, y: 0 },
  arrowright: { x: 1, y: 0 }, d: { x: 1, y: 0 }, right: { x: 1, y: 0 }
};

document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();

  if (key === 'enter') {
    if (state !== STATE.PLAYING) start();
    return;
  }
  if (key === ' ') {
    e.preventDefault();
    togglePause();
    return;
  }

  const d = DIRS[key];
  if (d) {
    e.preventDefault();
    if (state === STATE.PAUSED) togglePause();
    if (state === STATE.PLAYING) queueDir(d);
  }
});

function togglePause() {
  if (state === STATE.PLAYING) {
    state = STATE.PAUSED;
    showOverlay('일시정지', '스페이스를 누르거나 계속하기를 눌러 이어서 하세요.', '계속하기');
  } else if (state === STATE.PAUSED) {
    state = STATE.PLAYING;
    lastStep = performance.now();
    overlay.hidden = true;
  }
}

function start() {
  reset();
  state = STATE.PLAYING;
  lastStep = performance.now();
  overlay.hidden = true;
}

playBtn.addEventListener('click', () => {
  if (state === STATE.PAUSED) togglePause();
  else start();
});

document.getElementById('diff').addEventListener('click', e => {
  const btn = e.target.closest('button[data-speed]');
  if (!btn) return;
  baseSpeed = Number(btn.dataset.speed);
  document.querySelectorAll('#diff button').forEach(b => b.classList.toggle('on', b === btn));
});

document.getElementById('pad').addEventListener('click', e => {
  const btn = e.target.closest('button[data-dir]');
  if (!btn) return;
  if (state === STATE.PLAYING) queueDir(DIRS[btn.dataset.dir]);
});

muteBtn.addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('snake_muted', muted ? '1' : '0'); } catch (e) {}
  renderMute();
});

// swipe
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  touchStart = null;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  const d = Math.abs(dx) > Math.abs(dy)
    ? { x: Math.sign(dx), y: 0 }
    : { x: 0, y: Math.sign(dy) };
  if (state === STATE.PLAYING) queueDir(d);
}, { passive: true });

// pause when the tab loses focus mid-game
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === STATE.PLAYING) togglePause();
});

renderMute();
reset();
state = STATE.MENU;
requestAnimationFrame(frame);
</script>
</body>
</html>
